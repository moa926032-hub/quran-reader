<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المصحف الشريف - القارئ التفاعلي</title>
<style>
/* ========== CSS RESET & BASE ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#f5f0e8;
 --bg-card:#fff8f0;
 --text:#2c1810;
 --text-secondary:#5c3d2e;
 --border:#d4a574;
 --accent:#8b5e3c;
 --accent2:#c17817;
 --shadow:rgba(0,0,0,0.08);
 --input-bg:#fff;
 --header-bg:#1a3c2a;
 --header-text:#f5f0e8;
 --surah-name:#8b5e3c;
 --verse-bg:rgba(255,255,255,0.7);
 --modal-overlay:rgba(0,0,0,0.6);
 --modal-bg:#fff8f0;
 --scrollbar:#d4a574;
 --scrollbar-bg:#f5f0e8;
 --btn-disabled:#bbb;
 --tooltip-bg:#1a3c2a;
 --tooltip-text:#fff;
 --footer-bg:#1a3c2a;
 --footer-text:#d4c5a9;
}
body.dark-mode{
 --bg:#1a1a2e;
 --bg-card:#16213e;
 --text:#e8e8e8;
 --text-secondary:#b0b0b0;
 --border:#4a4a6a;
 --accent:#6a8caf;
 --accent2:#e8a838;
 --shadow:rgba(0,0,0,0.3);
 --input-bg:#2a2a4a;
 --header-bg:#0f0f1e;
 --header-text:#e8e8e8;
 --surah-name:#e8a838;
 --verse-bg:rgba(30,30,60,0.7);
 --modal-overlay:rgba(0,0,0,0.8);
 --modal-bg:#1e2a3e;
 --scrollbar:#4a4a6a;
 --scrollbar-bg:#1a1a2e;
 --btn-disabled:#555;
 --tooltip-bg:#0f0f1e;
 --tooltip-text:#e8e8e8;
 --footer-bg:#0f0f1e;
 --footer-text:#8a8aaa;
}
body.sepia-mode{
 --bg:#f4e4c1;
 --bg-card:#ead7b0;
 --text:#3b2a14;
 --text-secondary:#6b4f2a;
 --border:#b8965e;
 --accent:#8b6b3e;
 --accent2:#a67c3e;
 --shadow:rgba(0,0,0,0.1);
 --input-bg:#faf0dc;
 --header-bg:#5c4020;
 --header-text:#faf0dc;
 --surah-name:#7a5c2e;
 --verse-bg:rgba(234,215,176,0.7);
 --modal-overlay:rgba(0,0,0,0.5);
 --modal-bg:#ead7b0;
 --scrollbar:#b8965e;
 --scrollbar-bg:#f4e4c1;
 --btn-disabled:#aaa;
 --tooltip-bg:#5c4020;
 --tooltip-text:#faf0dc;
 --footer-bg:#5c4020;
 --footer-text:#d4b88a;
}
html{scroll-behavior:smooth}
body{font-family:'Amiri','Traditional Arabic','Scheherazade New',serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}
body.dark-mode,.dark-mode *{transition:background .3s,color .3s,border-color .3s}
body.sepia-mode,.sepia-mode *{transition:background .3s,color .3s,border-color .3s}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--scrollbar-bg)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}

/* ========== HEADER ========== */
.header{
 background:var(--header-bg);color:var(--header-text);
 padding:10px 14px;text-align:center;
 position:sticky;top:0;z-index:100;
 box-shadow:0 2px 12px rgba(0,0,0,0.2);
 display:flex;align-items:center;justify-content:space-between;
 flex-wrap:nowrap;gap:6px;
}
.header-right{
 display:flex;align-items:center;gap:8px;
 flex-shrink:0;
}
.logo-img{
 width:38px;height:38px;border-radius:50%;
 object-fit:cover;flex-shrink:0;
 border:2px solid rgba(255,255,255,0.2);
}
.header h1{font-size:20px;font-weight:700;white-space:nowrap}
.header-controls{
 display:flex;flex-wrap:nowrap;gap:5px;
 align-items:center;overflow-x:auto;
 -webkit-overflow-scrolling:touch;
 padding:2px 0;flex-shrink:0;
}
.header-controls::-webkit-scrollbar{display:none}

/* ========== HEADER BUTTONS (BIGGER) ========== */
.header-btn{
 background:rgba(255,255,255,0.12);
 border:1.5px solid rgba(255,255,255,0.25);
 color:var(--header-text);
 padding:7px 11px;
 border-radius:8px;
 cursor:pointer;
 font-size:14px;
 font-weight:600;
 transition:all .2s;
 display:flex;
 align-items:center;
 gap:4px;
 white-space:nowrap;
 position:relative;
 min-height:36px;
 line-height:1.2;
}
.header-btn:hover{
 background:rgba(255,255,255,0.28);
 transform:scale(1.05);
 box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.header-btn:active{
 transform:scale(0.95);
}
.header-btn.active{
 background:var(--accent2);
 border-color:var(--accent2);
 color:#fff;
 box-shadow:0 0 15px rgba(193,120,23,0.4);
}

/* ========== TOOLTIP (يظهر عند الضغط المطول) ========== */
.header-btn .tooltip{
 visibility:hidden;
 opacity:0;
 position:absolute;
 bottom:calc(100% + 12px);
 left:50%;
 transform:translateX(-50%);
 background:var(--tooltip-bg);
 color:var(--tooltip-text);
 padding:10px 16px;
 border-radius:10px;
 font-size:14px;
 font-weight:400;
 white-space:nowrap;
 max-width:280px;
 width:max-content;
 text-align:center;
 box-shadow:0 6px 25px rgba(0,0,0,0.25);
 z-index:999;
 transition:opacity .25s,visibility .25s;
 pointer-events:none;
 line-height:1.6;
}
.header-btn .tooltip::after{
 content:'';
 position:absolute;
 top:100%;
 left:50%;
 transform:translateX(-50%);
 border:8px solid transparent;
 border-top-color:var(--tooltip-bg);
}
.header-btn.show-tooltip .tooltip{
 visibility:visible;
 opacity:1;
}
.header-btn.click-flash::after{
 content:'✓';
 position:absolute;
 top:-8px;
 left:-6px;
 background:var(--accent2);
 color:#fff;
 border-radius:50%;
 width:22px;
 height:22px;
 font-size:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 2px 8px rgba(0,0,0,0.3);
 animation:flashPop .5s ease forwards;
}
@keyframes flashPop{
 0%{transform:scale(0)}
 50%{transform:scale(1.3)}
 100%{transform:scale(1);opacity:0}
}

/* ========== TOAST (رسائل عامة) ========== */
.toast{
 position:fixed;
 bottom:30px;
 left:50%;
 transform:translateX(-50%);
 background:var(--header-bg);
 color:var(--header-text);
 padding:12px 28px;
 border-radius:10px;
 font-size:15px;
 z-index:300;
 box-shadow:0 4px 20px rgba(0,0,0,0.25);
 display:none;
 animation:toastIn .3s ease;
 max-width:90%;
 text-align:center;
}
@keyframes toastIn{
 from{opacity:0;transform:translateX(-50%) translateY(20px)}
 to{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* ========== MAIN CONTAINER ========== */
.main-content{flex:1;width:100%}
.container{max-width:820px;margin:0 auto;padding:14px 10px 16px}

/* ========== SEARCH SECTION (معدلة ومحسنة تماماً) ========== */
.search-bar{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:16px;
 align-items:center;
 width:100%;
 max-width:100%;
}
.search-bar input, .search-bar select{
 flex:1 1 140px;
 min-width:0;
 width:auto;
 padding:9px 12px;
 border:2px solid var(--border);
 border-radius:8px;
 font-size:14px;
 background:var(--input-bg);
 color:var(--text);
 outline:none;
 transition:border .2s;
 font-family:inherit;
 max-width:100%;
}
.search-bar input:focus, .search-bar select:focus{border-color:var(--accent2)}
.search-bar .search-group{
 flex:1 1 160px;
 min-width:0;
 position:relative;
 max-width:100%;
}
.autocomplete-list{position:absolute;top:100%;right:0;left:0;background:var(--modal-bg);border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:50;display:none;box-shadow:0 4px 12px var(--shadow)}
.autocomplete-list div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:15px;transition:background .15s}
.autocomplete-list div:last-child{border-bottom:none}
.autocomplete-list div:hover{background:rgba(139,94,60,0.15)}
.autocomplete-list div .surah-page{color:var(--text-secondary);font-size:12px;margin-right:8px}

.page-input-group{
 display:flex;
 align-items:center;
 gap:6px;
 flex-shrink:0;
}
.page-input-group input{
 width:65px;
 flex:none;
 padding:8px 5px;
 text-align:center;
}

.search-btn{
 background:var(--accent2);
 color:#fff;
 border:none;
 padding:9px 16px;
 border-radius:8px;
 cursor:pointer;
 font-size:14px;
 font-weight:600;
 transition:background .2s,transform .15s;
 font-family:inherit;
 flex-shrink:0;
}
.search-btn:hover{background:var(--accent);transform:scale(1.03)}
.search-btn:active{transform:scale(0.96)}
.search-btn:disabled{background:var(--btn-disabled);cursor:not-allowed;transform:none}

/* ========== PAGE INFO ========== */
.page-info{text-align:center;margin-bottom:14px;font-size:18px;color:var(--surah-name);font-weight:700}
.page-info span{background:var(--verse-bg);padding:4px 16px;border-radius:20px;border:1px solid var(--border);display:inline-block}

/* ========== QURAN TEXT ========== */
.quran-page{background:var(--bg-card);border-radius:12px;padding:24px 20px;box-shadow:0 4px 20px var(--shadow);border:1px solid var(--border);margin-bottom:16px;transition:background .3s,border .3s}
.quran-text{font-size:26px;line-height:2.2;text-align:center;direction:rtl;font-weight:400}
.ayah{display:inline;cursor:pointer;transition:background .15s;border-radius:4px;padding:2px 0;position:relative}
.ayah:hover{background:rgba(193,120,23,0.12)}
.ayah-number{display:inline-block;font-size:14px;color:var(--accent2);margin:0 4px;font-family:sans-serif;vertical-align:super;line-height:1;position:relative;top:-2px;font-weight:700}
.ayah-number::before{content:"﴿";margin-left:2px;font-size:18px;color:var(--accent)}
.ayah-number::after{content:"﴾";margin-right:2px;font-size:18px;color:var(--accent)}
.surah-header{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.surah-header .surah-name{font-size:30px;font-weight:700;color:var(--surah-name);display:block}
.surah-header .surah-info{font-size:14px;color:var(--text-secondary);margin-top:4px}
.bismillah{font-size:28px;text-align:center;margin:12px 0 20px;color:var(--accent2);font-weight:500}

/* ========== NAVIGATION ========== */
.nav-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:6px}
.nav-btn{background:var(--accent2);color:#fff;border:none;padding:12px 26px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;transition:all .2s;font-family:inherit;min-width:90px;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn:hover:not(:disabled){background:var(--accent);transform:translateY(-2px);box-shadow:0 4px 14px var(--shadow)}
.nav-btn:active:not(:disabled){transform:translateY(0)}
.nav-btn:disabled{background:var(--btn-disabled);cursor:not-allowed;transform:none;box-shadow:none}

/* ========== LOADING ========== */
.loading{text-align:center;padding:40px;font-size:18px;color:var(--text-secondary)}
.loading .spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== MODAL ========== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-content{background:var(--modal-bg);border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.3);animation:modalIn .25s ease;border:1px solid var(--border)}
@keyframes modalIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:20px;color:var(--surah-name)}
.modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text-secondary);padding:0 6px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--accent2);transform:scale(1.1)}
.tafsir-text{font-size:17px;line-height:1.9;color:var(--text);text-align:justify}
.tafsir-text p{margin-bottom:12px;padding:10px 14px;background:var(--verse-bg);border-radius:8px;border-right:3px solid var(--accent2)}

/* ========== SEARCH RESULTS ========== */
.search-results{margin-top:12px;padding:12px;background:var(--verse-bg);border-radius:8px;border:1px solid var(--border);max-height:400px;overflow-y:auto;display:none;transition:display .2s}
.search-results.show{display:block}
.search-results .result-item{padding:10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.search-results .result-item:last-child{border-bottom:none}
.search-results .result-item:hover{background:rgba(139,94,60,0.1)}
.search-results .result-ayah{font-size:20px;line-height:1.7;margin-bottom:4px}
.search-results .result-meta{font-size:13px;color:var(--text-secondary)}
.search-results .result-meta span{margin-left:8px}

/* ========== AUDIO BAR ========== */
.audio-bar{text-align:center;margin-bottom:10px;padding:12px;background:var(--verse-bg);border-radius:8px;border:1px solid var(--border)}
.audio-bar audio{width:100%;max-width:420px;margin:0 auto;display:block;border-radius:6px;height:42px}
.audio-bar .audio-info{font-size:14px;color:var(--text-secondary);margin-bottom:6px}
.audio-bar select{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-family:inherit;font-size:13px;cursor:pointer}

/* ========== FOOTER ========== */
.footer{
 background:var(--footer-bg);
 color:var(--footer-text);
 text-align:center;
 padding:18px 16px 20px;
 font-size:15px;
 line-height:1.8;
 width:100%;
 margin-top:auto;
 border-top:2px solid var(--border);
}
.footer .dev-link{
 color:var(--accent2);
 text-decoration:none;
 font-weight:600;
 transition:color .2s,text-shadow .2s;
}
.footer .dev-link:hover{
 color:#e8a838;
 text-shadow:0 0 12px rgba(193,120,23,0.3);
}
.footer .heart{color:#e74c3c;display:inline-block;animation:heartBeat 1.4s infinite}
@keyframes heartBeat{
 0%,100%{transform:scale(1)}
 25%{transform:scale(1.2)}
 50%{transform:scale(1)}
 75%{transform:scale(1.15)}
}
.footer .separator{margin:0 8px;opacity:0.4}

/* ========== RESPONSIVE ========== */
@media(max-width:600px){
 .header{padding:8px 10px}
 .header h1{font-size:16px}
 .logo-img{width:32px;height:32px}
 .header-btn{font-size:12px;padding:5px 8px;min-height:32px}
 .header-btn .tooltip{font-size:11px;padding:6px 10px;max-width:200px}
 .container{padding:8px 4px 10px}
 .quran-page{padding:14px 10px}
 .quran-text{font-size:20px;line-height:2}
 .surah-header .surah-name{font-size:24px}
 .bismillah{font-size:22px}
 .nav-btn{padding:10px 18px;font-size:14px;min-width:70px}
 .search-bar input,.search-bar select{font-size:13px;padding:7px 10px}
 .modal-content{padding:16px;margin:10px}
 .tafsir-text{font-size:15px}
 .page-input-group input{width:56px;font-size:13px}
 .footer{font-size:12px;padding:14px 12px 16px}
}
@media(max-width:400px){
 .quran-text{font-size:18px;line-height:1.9}
 .nav-btn{padding:8px 12px;font-size:12px;min-width:55px}
 .header-btn{font-size:11px;padding:4px 7px;gap:3px}
 .header-controls{gap:3px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-right">
    <img class="logo-img" src="https://i.ibb.co/TxxnKz00/IMG-20260625-163052-731.jpg" alt="شعار الموقع">
    <h1>📖 المصحف الشريف</h1>
  </div>
  <div class="header-controls">

    <button class="header-btn" id="fullscreenBtn" onclick="toggleFullscreen()" aria-label="ملء الشاشة">
      ⛶
      <span class="tooltip">لتكبير الشاشة والقراءة بدون تشتيت — اضغط للدخول في وضع ملء الشاشة، ثم اضغط مرة أخرى للخروج</span>
    </button>

    <button class="header-btn" id="darkModeBtn" onclick="toggleDarkMode()" aria-label="الوضع الليلي">
      🌙
      <span class="tooltip">الوضع الليلي — يريح عينيك عند القراءة في الليل أو الإضاءة المنخفضة، خلفية داكنة ونص فاتح</span>
    </button>

    <button class="header-btn" id="sepiaModeBtn" onclick="toggleSepiaMode()" aria-label="الوضع الدافئ">
      🟤
      <span class="tooltip">الوضع الدافئ (Sepia) — ألوان دافئة تشبه صفحات المصحف الورقي، مريحة جداً للعين في القراءة الطويلة</span>
    </button>

    <button class="header-btn" id="tafsirBtn" onclick="loadTafsir()" aria-label="التفسير الميسر">
      📜 تفسير
      <span class="tooltip">التفسير الميسر — تفسير مبسط لكل آية في هذه الصفحة من تفسير الملك فهد للطباعة (الميسر)</span>
    </button>

    <button class="header-btn" id="audioBtn" onclick="toggleAudio()" aria-label="تشغيل الصوت">
      🔊 صوت
      <span class="tooltip">تشغيل الصوت — استمع للقراءة بصوت أشهر القراء: العفاسي، السديس، الحصري، الشاطري، المنشاوي</span>
    </button>

  </div>
</header>

<div class="toast" id="toast"></div>

<main class="main-content">
<div class="container" id="app">

  <div class="search-bar">
    <input type="text" id="textSearchInput" placeholder="🔍 ابحث عن كلمة أو آية...">
    <div class="search-group">
      <input type="text" id="surahSearch" placeholder="🔍 اكتب اسم السورة..." autocomplete="off" oninput="filterSurahs(this.value)">
      <div class="autocomplete-list" id="autocompleteList"></div>
    </div>
    <div class="page-input-group">
      <label>صفحة</label>
      <input type="number" id="pageInput" min="1" max="604" value="1" onkeydown="if(event.key==='Enter')goToPage()">
    </div>
    <button class="search-btn" onclick="goToPage()">اذهب</button>
  </div>

  <div class="search-results" id="searchResults"></div>

  <div class="audio-bar" id="audioBar" style="display:none">
    <div class="audio-info">🎙️ القارئ: 
      <select id="reciterSelect">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.abdurrahmaansudais">عبد الرحمن السديس</option>
        <option value="ar.shaatree">أبو بكر الشاطري</option>
        <option value="ar.husary">محمود خليل الحصري</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
      </select>
      &nbsp;|&nbsp; سيتم تشغيل صوت الآيات من بداية الصفحة
    </div>
    <audio id="audioPlayer" controls preload="none"></audio>
  </div>

  <div class="page-info"><span id="pageInfoDisplay">الصفحة 1 من 604</span></div>

  <div id="quranContainer">
    <div class="loading"><div class="spinner"></div>جاري تحميل القرآن الكريم...</div>
  </div>

  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">← السابق</button>
    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">التالي →</button>
  </div>

</div>
</main>

<footer class="footer">
  جميع الحقوق محفوظة © 2026 — تم التطوير بواسطة 
  <a class="dev-link" href="https://t.me/EA_G0BOT" target="_blank" rel="noopener">@EA_G0BOT</a>
  <span class="separator">|</span>
  <span>بوت الأذكار</span>
  <span class="separator">•</span>
  <span class="heart">♥</span>
  <span class="separator">•</span>
  <span style="font-size:13px;opacity:0.7">مطوري هذا الموقع</span>
</footer>

<div class="modal-overlay" id="tafsirModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📜 التفسير الميسر</h2>
      <button class="modal-close" onclick="closeModal('tafsirModal')">✕</button>
    </div>
    <div id="tafsirContent" class="tafsir-text"><p>جاري تحميل التفسير الميسر...</p></div>
  </div>
</div>

<div class="modal-overlay" id="ayahModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="ayahModalTitle">الآية</h2>
      <button class="modal-close" onclick="closeModal('ayahModal')">✕</button>
    </div>
    <div id="ayahModalContent"></div>
  </div>
</div>

<script>
// ============================================================
// ======================== JAVASCRIPT ========================
// ============================================================

const API_BASE = 'https://api.alquran.cloud/v1';
const EDITION = 'quran-uthmani';
const TAFSIR_EDITION = 'ar.muyassar';
const TOTAL_PAGES = 604;

// ---------- STATE ----------
let currentPage = 1;
let allSurahs = [];
let surahPageMap = {};
let isAudioActive = false;

// ---------- DOM REFS ----------
const $ = id => document.getElementById(id);
const quranContainer = $('quranContainer');
const pageInfoDisplay = $('pageInfoDisplay');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const pageInput = $('pageInput');
const surahSearch = $('surahSearch');
const autocompleteList = $('autocompleteList');
const tafsirModal = $('tafsirModal');
const tafsirContent = $('tafsirContent');
const audioBar = $('audioBar');
const audioPlayer = $('audioPlayer');
const searchResults = $('searchResults');
const searchInput = $('textSearchInput');

// ============================================================
// 1. TOOLTIP SYSTEM: تظهر عند الضغط المطول أو الضغط المتكرر
// ============================================================
let pressTimers = {};
let pressCounts = {};

function setupTooltips() {
  document.querySelectorAll('.header-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const id = this.id || Math.random();
      if (!pressCounts[id]) pressCounts[id] = 0;
      pressCounts[id]++;

      if (pressCounts[id] >= 3) {
        this.classList.add('show-tooltip');
        setTimeout(() => {
          this.classList.remove('show-tooltip');
        }, 3000);
        pressCounts[id] = 0;
      }

      clearTimeout(this._resetTimer);
      this._resetTimer = setTimeout(() => {
        pressCounts[id] = 0;
      }, 5000);

      this.classList.add('click-flash');
      setTimeout(() => this.classList.remove('click-flash'), 500);
    });

    btn.addEventListener('mousedown', function(e) {
      const id = this.id || Math.random();
      pressTimers[id] = setTimeout(() => {
        this.classList.add('show-tooltip');
        setTimeout(() => this.classList.remove('show-tooltip'), 4000);
      }, 600);
    });
    btn.addEventListener('mouseup', function(e) {
      const id = this.id || Math.random();
      clearTimeout(pressTimers[id]);
    });
    btn.addEventListener('mouseleave', function(e) {
      const id = this.id || Math.random();
      clearTimeout(pressTimers[id]);
    });

    btn.addEventListener('touchstart', function(e) {
      const id = this.id || Math.random();
      pressTimers[id] = setTimeout(() => {
        this.classList.add('show-tooltip');
        setTimeout(() => this.classList.remove('show-tooltip'), 4000);
      }, 600);
    });
    btn.addEventListener('touchend', function(e) {
      const id = this.id || Math.random();
      clearTimeout(pressTimers[id]);
    });
    btn.addEventListener('touchcancel', function(e) {
      const id = this.id || Math.random();
      clearTimeout(pressTimers[id]);
    });
  });
}

// ============================================================
// 2. INIT: Load saved page, surahs, and first page
// ============================================================
async function init() {
  setupTooltips();

  const saved = localStorage.getItem('quranLastPage');
  if (saved && saved >= 1 && saved <= TOTAL_PAGES) {
    currentPage = parseInt(saved);
  }
  pageInput.value = currentPage;

  await loadSurahs();
  await loadPage(currentPage);
}

// ============================================================
// 3. SURAHS: Load surah list and build page map
// ============================================================
async function loadSurahs() {
  try {
    const res = await fetch(`${API_BASE}/surah`);
    const json = await res.json();
    allSurahs = json.data;

    const promises = allSurahs.map(async (surah) => {
      try {
        const r = await fetch(`${API_BASE}/surah/${surah.number}/${EDITION}?limit=1`);
        const j = await r.json();
        if (j.data && j.data.ayahs && j.data.ayahs.length > 0) {
          const page = j.data.ayahs[0].page;
          surahPageMap[surah.name] = page;
          surahPageMap[surah.englishName] = page;
          surahPageMap[surah.number.toString()] = page;
        }
      } catch(e) { /* skip */ }
    });
    await Promise.all(promises);
  } catch(e) {
    showToast('فشل تحميل قائمة السور');
  }
}

// ============================================================
// 4. LOAD PAGE
// ============================================================
async function loadPage(pageNum) {
  if (pageNum < 1 || pageNum > TOTAL_PAGES) return;

  currentPage = pageNum;
  pageInput.value = pageNum;
  localStorage.setItem('quranLastPage', pageNum);

  pageInfoDisplay.textContent = `الصفحة ${pageNum} من ${TOTAL_PAGES}`;
  prevBtn.disabled = pageNum === 1;
  nextBtn.disabled = pageNum === TOTAL_PAGES;

  quranContainer.innerHTML = `<div class="loading"><div class="spinner"></div>جاري تحميل الصفحة ${pageNum}...</div>`;

  try {
    const pageRes = await fetch(`${API_BASE}/page/${pageNum}/${EDITION}`);
    const pageData = await pageRes.json();

    if (!pageData.data || !pageData.data.ayahs) {
      quranContainer.innerHTML = '<div class="loading">عذراً، فشل تحميل الصفحة</div>';
      return;
    }

    const ayahs = pageData.data.ayahs;
    renderPage(ayahs, pageNum);
    updateAudioUrl(pageNum, ayahs);

    searchResults.classList.remove('show');
    searchResults.innerHTML = '';

  } catch(e) {
    quranContainer.innerHTML = '<div class="loading">حدث خطأ في تحميل الصفحة. حاول مرة أخرى.</div>';
    showToast('خطأ في الاتصال بالخادم');
  }
}

// ============================================================
// 5. RENDER
// ============================================================
function renderPage(ayahs, pageNum) {
  const surahGroups = [];
  let currentSurah = null;
  let currentAyahs = [];

  ayahs.forEach(ayah => {
    if (!currentSurah || currentSurah.number !== ayah.surah.number) {
      if (currentSurah) surahGroups.push({ surah: currentSurah, ayahs: currentAyahs });
      currentSurah = ayah.surah;
      currentAyahs = [ayah];
    } else {
      currentAyahs.push(ayah);
    }
  });
  if (currentSurah) surahGroups.push({ surah: currentSurah, ayahs: currentAyahs });

  let html = '<div class="quran-page">';

  surahGroups.forEach((group, idx) => {
    const surah = group.surah;
    const isSurahStart = group.ayahs[0].numberInSurah === 1;

    if (isSurahStart) {
      html += `<div class="surah-header">`;
      html += `<span class="surah-name">${surah.name}</span>`;
      html += `<span class="surah-info">${surah.englishName} — ${surah.englishNameTranslation}</span>`;
      html += `</div>`;
      if (surah.number !== 1 && surah.number !== 9) {
        html += `<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
      }
    }

    html += `<div class="quran-text">`;
    group.ayahs.forEach(ayah => {
      html += `<span class="ayah" onclick="showAyahDetail(${ayah.number}, ${ayah.surah.number}, '${ayah.surah.name.replace(/'/g, "\\'")}')">`;
      html += ayah.text;
      html += `<span class="ayah-number">${ayah.numberInSurah}</span>`;
      html += `</span> `;
    });
    html += `</div>`;
  });

  html += '</div>';
  quranContainer.innerHTML = html;
}

// ============================================================
// 6. NAVIGATION
// ============================================================
function changePage(delta) {
  const newPage = currentPage + delta;
  if (newPage >= 1 && newPage <= TOTAL_PAGES) loadPage(newPage);
}

function goToPage() {
  let val = parseInt(pageInput.value);
  if (isNaN(val) || val < 1) val = 1;
  if (val > TOTAL_PAGES) val = TOTAL_PAGES;
  pageInput.value = val;
  loadPage(val);
}

// ============================================================
// 7. SURAH SEARCH (Autocomplete)
// ============================================================
function filterSurahs(query) {
  const list = autocompleteList;
  if (!query || query.trim() === '') {
    list.style.display = 'none';
    return;
  }
  query = query.trim();

  const results = allSurahs.filter(s => {
    return s.name.includes(query) ||
      s.englishName.toLowerCase().includes(query.toLowerCase()) ||
      s.englishNameTranslation.toLowerCase().includes(query.toLowerCase());
  }).slice(0, 10);

  if (results.length === 0) {
    list.style.display = 'none';
    return;
  }

  list.innerHTML = '';
  results.forEach(s => {
    const page = surahPageMap[s.name] || '?';
    const div = document.createElement('div');
    div.innerHTML = `${s.name} <span class="surah-page">(${s.englishName}) — صفحة ${page}</span>`;
    div.onclick = () => {
      surahSearch.value = s.name;
      list.style.display = 'none';
      if (page !== '?' && page >= 1 && page <= TOTAL_PAGES) {
        loadPage(page);
        showToast(`📖 ${s.name} — تبدأ من صفحة ${page}`);
      }
    };
    list.appendChild(div);
  });
  list.style.display = 'block';
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-group')) autocompleteList.style.display = 'none';
});

surahSearch.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = surahSearch.value.trim();
    if (query) filterSurahs(query);
    const first = autocompleteList.querySelector('div');
    if (first) first.click();
  }
});

// ============================================================
// 8. TAFSIR
// ============================================================
async function loadTafsir() {
  tafsirModal.classList.add('show');
  tafsirContent.innerHTML = '<p>جاري تحميل التفسير الميسر...</p>';

  try {
    const res = await fetch(`${API_BASE}/page/${currentPage}/${TAFSIR_EDITION}`);
    const json = await res.json();

    if (!json.data || !json.data.ayahs) {
      tafsirContent.innerHTML = '<p>عذراً، التفسير غير متاح لهذه الصفحة</p>';
      return;
    }

    let html = `<p style="margin-bottom:14px;font-weight:700;font-size:18px;color:var(--accent2)">📜 التفسير الميسر — الصفحة ${currentPage}</p>`;
    json.data.ayahs.forEach(ayah => {
      const surahName = ayah.surah.name;
      const ayahNum = ayah.numberInSurah;
      html += `<p><strong>${surahName} (${ayahNum})</strong>: ${ayah.text}</p>`;
    });
    tafsirContent.innerHTML = html;
  } catch(e) {
    tafsirContent.innerHTML = '<p>حدث خطأ في تحميل التفسير</p>';
    showToast('فشل تحميل التفسير');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target === el) el.classList.remove('show');
  });
});

// ============================================================
// 9. AYAH DETAIL
// ============================================================
async function showAyahDetail(ayahNumber, surahNumber, surahName) {
  const modal = $('ayahModal');
  const title = $('ayahModalTitle');
  const content = $('ayahModalContent');

  title.textContent = `الآية — ${surahName}`;
  content.innerHTML = '<p>جاري التحميل...</p>';
  modal.classList.add('show');

  try {
    const [quranRes, tafsirRes] = await Promise.all([
      fetch(`${API_BASE}/ayah/${surahNumber}:${ayahNumber}/${EDITION}`),
      fetch(`${API_BASE}/ayah/${surahNumber}:${ayahNumber}/${TAFSIR_EDITION}`)
    ]);
    const quran = await quranRes.json();
    const tafsir = await tafsirRes.json();

    let html = '';
    if (quran.data) {
      html += `<div style="font-size:28px;line-height:2;text-align:center;margin-bottom:16px;padding:16px;background:var(--verse-bg);border-radius:8px">${quran.data.text} <span style="font-size:14px;color:var(--accent2)">﴿${quran.data.numberInSurah}﴾</span></div>`;
    }
    if (tafsir.data) {
      html += `<div style="border-top:1px solid var(--border);padding-top:12px;margin-top:8px"><strong style="color:var(--accent2)">📜 التفسير:</strong><p style="margin-top:6px;font-size:15px;line-height:1.8">${tafsir.data.text}</p></div>`;
    }
    html += `<div style="margin-top:10px;font-size:13px;color:var(--text-secondary)">📖 الصفحة ${quran.data?.page || '?'} · الجزء ${quran.data?.juz || '?'}</div>`;
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<p>حدث خطأ</p>';
  }
}

// ============================================================
// 10. AUDIO
// ============================================================
function toggleAudio() {
  if (!isAudioActive) {
    audioBar.style.display = 'block';
    $('audioBtn').classList.add('active');
    isAudioActive = true;
    updateAudioUrl(currentPage);
    setTimeout(() => {
      if (audioPlayer.src) audioPlayer.play().catch(() => {});
    }, 300);
  } else {
    audioBar.style.display = 'none';
    $('audioBtn').classList.remove('active');
    audioPlayer.pause();
    audioPlayer.src = '';
    isAudioActive = false;
  }
}

function updateAudioUrl(pageNum, ayahs) {
  let firstAyahNum = 1;
  if (ayahs && ayahs.length > 0) {
    firstAyahNum = ayahs[0].number;
  } else {
    firstAyahNum = Math.min((pageNum - 1) * 10 + 1, 6236);
  }

  const reciter = $('reciterSelect').value;
  const audioUrl = `https://cdn.islamic.network/quran/audio/128/${reciter}/${firstAyahNum}.mp3`;
  audioPlayer.src = audioUrl;
}

$('reciterSelect').addEventListener('change', () => {
  if (isAudioActive) {
    updateAudioUrl(currentPage);
    audioPlayer.play().catch(() => {});
    showToast(`🎙️ تم التبديل إلى ${$('reciterSelect').options[$('reciterSelect').selectedIndex].text}`);
  }
});

// ============================================================
// 11. FULLSCREEN
// ============================================================
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    $('fullscreenBtn').classList.add('active');
    showToast('⛶ تم الدخول في وضع ملء الشاشة — اضغط F أو الزر للخروج');
  } else {
    document.exitFullscreen().catch(() => {});
    $('fullscreenBtn').classList.remove('active');
    showToast('⛶ تم الخروج من وضع ملء الشاشة');
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) $('fullscreenBtn').classList.remove('active');
});

// ============================================================
// 12. DARK / SEPIA MODES
// ============================================================
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  document.body.classList.remove('sepia-mode');
  const isDark = document.body.classList.contains('dark-mode');
  $('darkModeBtn').classList.toggle('active', isDark);
  $('sepiaModeBtn').classList.remove('active');
  localStorage.setItem('quranTheme', isDark ? 'dark' : 'light');
  showToast(isDark ? '🌙 تم تفعيل الوضع الليلي — إضاءة مريحة للعين' : '☀️ تم تفعيل الوضع العادي');
}

function toggleSepiaMode() {
  document.body.classList.toggle('sepia-mode');
  document.body.classList.remove('dark-mode');
  const isSepia = document.body.classList.contains('sepia-mode');
  $('sepiaModeBtn').classList.toggle('active', isSepia);
  $('darkModeBtn').classList.remove('active');
  localStorage.setItem('quranTheme', isSepia ? 'sepia' : 'light');
  showToast(isSepia ? '🟤 تم تفعيل الوضع الدافئ (Sepia) — ألوان تشبه المصحف الورقي' : '☀️ تم تفعيل الوضع العادي');
}

const savedTheme = localStorage.getItem('quranTheme');
if (savedTheme === 'dark') toggleDarkMode();
else if (savedTheme === 'sepia') toggleSepiaMode();

// ============================================================
// 13. TEXT SEARCH
// ============================================================
let searchTimeout = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const query = searchInput.value.trim();
  if (query.length < 3) {
    searchResults.classList.remove('show');
    return;
  }
  searchTimeout = setTimeout(() => textSearch(query), 500);
});

async function textSearch(query) {
  searchResults.classList.add('show');
  searchResults.innerHTML = '<div class="loading" style="padding:20px"><div class="spinner"></div>جارٍ البحث...</div>';

  try {
    const res = await fetch(`${API_BASE}/search/${encodeURIComponent(query)}/all/ar`);
    const json = await res.json();

    if (!json.data || !json.data.matches || json.data.matches.length === 0) {
      searchResults.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-secondary)">❌ لا توجد نتائج للبحث</div>';
      return;
    }

    const matches = json.data.matches.slice(0, 20);
    let html = `<div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px">🔍 ${json.data.matches.length} نتيجة للبحث: "${query}"</div>`;

    matches.forEach(match => {
      const page = match.page || '?';
      html += `<div class="result-item" onclick="loadPage(${page}); searchResults.classList.remove('show'); searchInput.value=''">`;
      html += `<div class="result-ayah">${match.text}</div>`;
      html += `<div class="result-meta"><span>📖 ${match.surah.name}</span><span>آية ${match.numberInSurah}</span><span>📄 صفحة ${page}</span></div>`;
      html += `</div>`;
    });

    searchResults.innerHTML = html;
  } catch(e) {
    searchResults.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-secondary)">⚠️ حدث خطأ في البحث</div>';
  }
}

// ============================================================
// 14. SWIPE SUPPORT
// ============================================================
let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
const SWIPE_THRESHOLD = 60;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

document.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  touchEndY = e.changedTouches[0].screenY;
  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;
  if (Math.abs(diffX) < SWIPE_THRESHOLD) return;
  if (Math.abs(diffX) < Math.abs(diffY) * 1.5) return;
  if (diffX > 0 && currentPage < TOTAL_PAGES) changePage(1);
  else if (diffX < 0 && currentPage > 1) changePage(-1);
}, {passive: true});

// ============================================================
// 15. KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); if (currentPage < TOTAL_PAGES) changePage(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); if (currentPage > 1) changePage(-1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
  else if (e.key === 't' || e.key === 'T') { e.preventDefault(); loadTafsir(); }
  else if (e.key === 'Escape') { document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); }
});

// ============================================================
// 16. TOAST
// ============================================================
function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

pageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') goToPage();
});

// ============================================================
// START APP
// ============================================================
init();

console.log('📖 المصحف الشريف - القارئ التفاعلي ملائم تماماً لجميع الشاشات');
</script>
</body>
</html>
